name: Action Lint
on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

  push:
    branches: ['main']
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

permissions: {}

jobs:
  action-lint:
    permissions:
      contents: read # Clone the repository
    name: Action lint
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            api.github.com:443
            github.com:443
            go.dev:443
            hooks.slack.com:443
            release-assets.githubusercontent.com:443

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find yamls
        id: get_yamls
        run: |
          set -ex
          mapfile -t yamls < <(find .github/workflows -name "*.y*ml" | grep -v dependabot.)
          echo "files=${yamls[*]}" >> "${GITHUB_OUTPUT}"

      - name: Action lint
        uses: chainguard-actions/reviewdog-action-actionlint@99dba8c2ec008638f2e6b9ab4b7b14fd80913b17 # v1.84.1
        env:
          SHELLCHECK_OPTS: "--exclude=SC2129"
        with:
          # actionlint does not accept a bare `uses: $/` self-repository
          # reference yet (rhysd/actionlint#711). Ignore only that error. The
          # action's entrypoint passes these flags through `eval`, so the
          # pattern is single-quoted to keep its `"` and `\$` literal.
          actionlint_flags: '-ignore=''action."\$/'' ${{ steps.get_yamls.outputs.files }}'

name: Test

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions: {}

jobs:
  test:
    name: Basic Test
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            *.githubapp.com:443
            c.pki.goog:80
            dl.enforce.dev:443
            github.com:443
            o.pki.goog:80
            ocsp.pki.goog:80
            ocsp.sectigo.com:80
            updates.cdn-apple.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
      - run: chainctl version

  test-options:
    name: Test with non-default options
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            *.githubapp.com:443
            c.pki.goog:80
            dl.enforce.dev:443
            files.pythonhosted.org:443
            github.com:443
            o.pki.goog:80
            ocsp.pki.goog:80
            ocsp.sectigo.com:80
            pypi.org:443
            updates.cdn-apple.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          retry-all-errors: 'false'
          setup-python-keyring: 'true'
          version: '0.2.313'
          # A non-default but well-formed host must pass validation.
          apk-host: 'apk.example.com:8443'
          libraries-host: 'libraries.example.com'
      - run: chainctl version
      - run: chainctl version 2>&1 | grep -E 'GitVersion:[[:space:]]+0\.2\.313'
      - run: python -m pip show keyrings-chainguard-libraries

  test-host-validation:
    name: Test malformed host inputs are rejected
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            *.githubapp.com:443
            c.pki.goog:80
            dl.enforce.dev:443
            github.com:443
            o.pki.goog:80
            ocsp.pki.goog:80
            ocsp.sectigo.com:80

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The shell metacharacter case from the original report.
      - id: metachars
        continue-on-error: true
        uses: ./
        with:
          apk-host: 'apk.cgr.dev; touch /tmp/pwned'

      # The newline case: with validation removed and env-auth on, this
      # value appends a second assignment to $GITHUB_ENV.
      - id: newline
        continue-on-error: true
        uses: ./
        with:
          apk-host: "apk.cgr.dev\nINJECTED=1"

      - id: libraries
        continue-on-error: true
        uses: ./
        with:
          libraries-host: 'libraries.cgr.dev$(id)'

      - name: Assert every malformed host failed the action
        env:
          METACHARS_OUTCOME: ${{ steps.metachars.outcome }}
          NEWLINE_OUTCOME: ${{ steps.newline.outcome }}
          LIBRARIES_OUTCOME: ${{ steps.libraries.outcome }}
        run: |
          status=0
          for var in METACHARS_OUTCOME NEWLINE_OUTCOME LIBRARIES_OUTCOME; do
            if [[ "${!var}" != "failure" ]]; then
              echo "::error::${var} was ${!var}, expected failure"
              status=1
            fi
          done
          # Backstops: these only fire if validation is later dropped and a
          # step interpolates the raw input again.
          if [[ -e /tmp/pwned ]]; then
            echo "::error::command injection succeeded: /tmp/pwned exists"
            status=1
          fi
          if [[ -n "${INJECTED:-}" ]]; then
            echo "::error::env injection succeeded: INJECTED is set"
            status=1
          fi
          exit "${status}"

  test-windows-hash-fallback:
    name: Test PowerShell hash fallback parity
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            *.githubapp.com:443
            c.pki.goog:80
            github.com:443
            o.pki.goog:80
            ocsp.pki.goog:80
            ocsp.sectigo.com:80

      # The action's PowerShell fallback never runs on hosted runners
      # (Git Bash provides sha256sum), so exercise the exact fallback
      # pipeline here and require byte-for-byte parity with sha256sum.
      - name: Compare sha256sum, pwsh, and powershell outputs
        run: |
          printf 'chainctl fallback parity probe' > probe.bin
          via_sha256sum=$(sha256sum ./probe.bin | awk '{print $1}')
          via_pwsh=$(pwsh -NoProfile -NonInteractive -Command "(Get-FileHash -Algorithm SHA256 -LiteralPath './probe.bin').Hash.ToLower()" | tr -d '\r')
          via_powershell=$(powershell -NoProfile -NonInteractive -Command "(Get-FileHash -Algorithm SHA256 -LiteralPath './probe.bin').Hash.ToLower()" | tr -d '\r')
          [[ -n "${via_sha256sum}" ]]
          [[ "${via_sha256sum}" == "${via_pwsh}" ]]
          [[ "${via_sha256sum}" == "${via_powershell}" ]]

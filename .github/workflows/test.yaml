name: Test

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions: {}

jobs:
  test:
    name: Basic Test
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            *.githubapp.com:443
            c.pki.goog:80
            dl.enforce.dev:443
            github.com:443
            o.pki.goog:80
            ocsp.pki.goog:80
            ocsp.sectigo.com:80
            updates.cdn-apple.com:443

      # On Windows, harden-runner's step returns a few seconds before its
      # agent redirects DNS to its proxy and turns on the block-all egress
      # filter. A download started in that gap resolves outside the proxy,
      # gets no allow rule, and is cut off once the filter is on (retries
      # then hit the cached DNS answer and stay blocked). Wait for the
      # redirect, then clear the DNS cache so every lookup goes through
      # the proxy. Remove this once harden-runner waits for its agent.
      - name: Wait for harden-runner agent (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 60; $i++) {
            $servers = (Get-DnsClientServerAddress -AddressFamily IPv4).ServerAddresses
            if ($servers -contains '127.0.0.1') {
              Clear-DnsClientCache
              Write-Output "harden-runner DNS proxy active after ${i}s"
              exit 0
            }
            Start-Sleep -Seconds 1
          }
          Write-Output "::warning::harden-runner DNS proxy not detected after 60s; continuing"

      - uses: $/
      - run: chainctl version

  test-options:
    name: Test with non-default options
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            *.githubapp.com:443
            c.pki.goog:80
            dl.enforce.dev:443
            files.pythonhosted.org:443
            github.com:443
            o.pki.goog:80
            ocsp.pki.goog:80
            ocsp.sectigo.com:80
            pypi.org:443
            updates.cdn-apple.com:443

      - uses: $/
        with:
          retry-all-errors: 'false'
          setup-python-keyring: 'true'
          version: '0.2.313'
          # A non-default but well-formed host must pass validation.
          apk-host: 'apk.example.com:8443'
          libraries-host: 'libraries.example.com'
      - run: chainctl version
      - run: chainctl version 2>&1 | grep -E 'GitVersion:[[:space:]]+0\.2\.313'
      - run: python -m pip show keyrings-chainguard-libraries

  test-host-validation:
    name: Test malformed inputs are rejected
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            *.githubapp.com:443
            c.pki.goog:80
            dl.enforce.dev:443
            github.com:443
            o.pki.goog:80
            ocsp.pki.goog:80
            ocsp.sectigo.com:80


      # The shell metacharacter case from the original report.
      - id: metachars
        continue-on-error: true
        uses: $/
        with:
          apk-host: 'apk.cgr.dev; touch /tmp/pwned'

      # The newline case: with validation removed and env-auth on, this
      # value appends a second assignment to $GITHUB_ENV.
      - id: newline
        continue-on-error: true
        uses: $/
        with:
          apk-host: "apk.cgr.dev\nINJECTED=1"

      - id: libraries
        continue-on-error: true
        uses: $/
        with:
          libraries-host: 'libraries.cgr.dev$(id)'

      # environment and version feed the download URL; a crafted value
      # must not be able to redirect the download elsewhere.
      - id: environment
        continue-on-error: true
        uses: $/
        with:
          environment: 'evil.example/x?'

      - id: version
        continue-on-error: true
        uses: $/
        with:
          version: '../../evil/latest'

      - id: verbosity
        continue-on-error: true
        uses: $/
        with:
          verbosity: '1; id'

      - name: Assert every malformed input failed the action
        env:
          METACHARS_OUTCOME: ${{ steps.metachars.outcome }}
          NEWLINE_OUTCOME: ${{ steps.newline.outcome }}
          LIBRARIES_OUTCOME: ${{ steps.libraries.outcome }}
          ENVIRONMENT_OUTCOME: ${{ steps.environment.outcome }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          VERBOSITY_OUTCOME: ${{ steps.verbosity.outcome }}
        run: |
          status=0
          for var in METACHARS_OUTCOME NEWLINE_OUTCOME LIBRARIES_OUTCOME \
                     ENVIRONMENT_OUTCOME VERSION_OUTCOME VERBOSITY_OUTCOME; do
            if [[ "${!var}" != "failure" ]]; then
              echo "::error::${var} was ${!var}, expected failure"
              status=1
            fi
          done
          # Backstops: these only fire if validation is later dropped and a
          # step interpolates the raw input again.
          if [[ -e /tmp/pwned ]]; then
            echo "::error::command injection succeeded: /tmp/pwned exists"
            status=1
          fi
          if [[ -n "${INJECTED:-}" ]]; then
            echo "::error::env injection succeeded: INJECTED is set"
            status=1
          fi
          exit "${status}"

  test-windows-hash-fallback:
    name: Test PowerShell hash fallback parity
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            *.githubapp.com:443
            c.pki.goog:80
            github.com:443
            o.pki.goog:80
            ocsp.pki.goog:80
            ocsp.sectigo.com:80

      # Same harden-runner startup race as in the Basic Test job. This job
      # is fast enough that the Post step stops the agent mid-setup, which
      # can leave its egress filter on and keep the job from ever reporting
      # completion. Wait for the agent to finish starting first.
      - name: Wait for harden-runner agent (Windows)
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 60; $i++) {
            $servers = (Get-DnsClientServerAddress -AddressFamily IPv4).ServerAddresses
            if ($servers -contains '127.0.0.1') {
              Clear-DnsClientCache
              Write-Output "harden-runner DNS proxy active after ${i}s"
              exit 0
            }
            Start-Sleep -Seconds 1
          }
          Write-Output "::warning::harden-runner DNS proxy not detected after 60s; continuing"

      # The action's PowerShell fallback never runs on hosted runners
      # (Git Bash provides sha256sum), so exercise the exact fallback
      # pipeline here and require byte-for-byte parity with sha256sum.
      - name: Compare sha256sum, pwsh, and powershell outputs
        run: |
          printf 'chainctl fallback parity probe' > probe.bin
          via_sha256sum=$(sha256sum ./probe.bin | awk '{print $1}')
          via_pwsh=$(pwsh -NoProfile -NonInteractive -Command "(Get-FileHash -Algorithm SHA256 -LiteralPath './probe.bin').Hash.ToLower()" | tr -d '\r')
          via_powershell=$(powershell -NoProfile -NonInteractive -Command "(Get-FileHash -Algorithm SHA256 -LiteralPath './probe.bin').Hash.ToLower()" | tr -d '\r')
          [[ -n "${via_sha256sum}" ]]
          [[ "${via_sha256sum}" == "${via_pwsh}" ]]
          [[ "${via_sha256sum}" == "${via_powershell}" ]]

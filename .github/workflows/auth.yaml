name: Test with auth

on:
  push:
    branches:
      - 'main'
  pull_request_target:
    branches:
      - 'main'

permissions: {}

jobs:
  test:
    name: Test with auth
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Needed for auth

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            *.githubapp.com:443
            console-api.enforce.dev:443
            dl.enforce.dev:443
            github.com:443
            issuer.enforce.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No `ref:` on purpose: under pull_request_target the default
          # checkout is the trusted base commit, never the PR head. Do not
          # add a PR ref or allow-unsafe-pr-checkout here; this job holds
          # id-token: write.
          persist-credentials: false
      - uses: ./
        with:
          identity: ce2d1984a010471142503340d670612d63ffb9f6/d05d31ba65ec54d1
      - run: chainctl auth status
